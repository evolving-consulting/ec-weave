<template>
  <div class="qed-root">

    <!-- Object picker -->
    <lightning-combobox
      label="Object"
      value={_query.soqlObject}
      options={relatedObjectOptions}
      onchange={handleObjectChange}
      required
    ></lightning-combobox>

    <template if:true={hasObject}>

      <!-- Parent query selector (multi-level) -->
      <template if:true={hasParentQueryOptions}>
        <div class="qed-section">
          <lightning-combobox
            label="Parent Query (optional)"
            value={_query.parentQueryLocalKey}
            options={parentQueryOptions}
            placeholder="-- None (root query) --"
            onchange={handleParentQuerySelectorChange}
          ></lightning-combobox>
          <p class="qed-hint">Leave blank to query against the main template record. Select a parent to query within each parent-query row.</p>
        </div>
      </template>

      <!-- Fields -->
      <div class="qed-section">
        <p class="qed-label">Fields</p>

        <!-- Selected chips -->
        <template if:true={hasSelectedFields}>
          <div class="qed-chips">
            <template for:each={selectedFields} for:item="field">
              <span key={field.apiName} class="qed-chip">
                {field.label}
                <template if:false={field.isId}>
                  <button
                    class="qed-chip-remove"
                    data-field={field.apiName}
                    onclick={handleFieldDeselect}
                    title="Remove"
                  >×</button>
                </template>
              </span>
            </template>
          </div>
        </template>

        <!-- Search + add fields -->
        <div class="qed-search-row">
          <input
            type="search"
            class="qed-search"
            placeholder="Search fields to add…"
            value={fieldSearchTerm}
            oninput={handleSearchChange}
          />
        </div>

        <template if:true={isLoadingFields}>
          <p class="qed-hint">Loading fields…</p>
        </template>

        <template if:true={hasUnselectedFields}>
          <div class="qed-field-list">
            <template for:each={unselectedFilteredFields} for:item="field">
              <button
                key={field.apiName}
                class="qed-field-row"
                data-field={field.apiName}
                onclick={handleFieldSelect}
              >
                <span class="qed-field-label">{field.label}</span>
                <span class="qed-field-api">{field.apiName}</span>
              </button>
            </template>
          </div>
        </template>

        <!-- Relationship traversal groups -->
        <template if:true={hasRelatedFieldGroups}>
          <div class="qed-rel-groups">
            <template for:each={filteredRelatedFieldGroups} for:item="group">
              <div key={group.relationshipName} class="qed-rel-group">
                <button
                  class="qed-rel-group-header"
                  data-rel={group.relationshipName}
                  onclick={handleToggleRelGroup}
                >
                  <span class="qed-rel-group-label">{group.groupLabel} &rarr;</span>
                  <span class="qed-rel-toggle">{group.expanded ? '▾' : '▸'}</span>
                </button>
                <template if:true={group.expanded}>
                  <div class="qed-field-list qed-rel-field-list">
                    <template for:each={group.visibleFields} for:item="relField">
                      <button
                        key={relField.apiName}
                        class="qed-field-row"
                        data-field={relField.apiName}
                        data-rel={group.relationshipName}
                        onclick={handleRelFieldSelect}
                      >
                        <span class="qed-field-label">{relField.label}</span>
                        <span class="qed-field-api">{relField.apiName}</span>
                      </button>
                    </template>
                  </div>
                </template>
              </div>
            </template>
          </div>
        </template>
      </div>

      <!-- Filter (WHERE clause) -->
      <div class="qed-section">
        <p class="qed-label">Filter (WHERE clause)</p>
        <input
          type="text"
          class="qed-search"
          placeholder="e.g. IsPrimary__c = true OR Status__c = 'Active'"
          value={filterClause}
          onchange={handleFilterChange}
        />
        <p class="qed-hint">Optional conditions appended after WHERE. Leave blank for no filter.</p>
      </div>

      <!-- Sort + Limit -->
      <div class="qed-section">
        <p class="qed-label">Sort &amp; Limit</p>
        <template for:each={sortRows} for:item="srow">
          <div key={srow.id} class="qed-sort-row">
            <lightning-combobox
              label=""
              value={srow.field}
              options={sortFieldOptions}
              data-idx={srow.id}
              onchange={handleSortRowFieldChange}
            ></lightning-combobox>
            <lightning-combobox
              label=""
              value={srow.dir}
              options={sortDirectionOptions}
              data-idx={srow.id}
              onchange={handleSortRowDirChange}
            ></lightning-combobox>
            <button class="qed-sort-remove" data-idx={srow.id} onclick={handleSortRowRemove}>×</button>
          </div>
        </template>
        <button class="qed-sort-add" onclick={handleSortRowAdd}>+ Sort column</button>
        <lightning-input
          label="Limit"
          type="number"
          min="1"
          max="200"
          value={queryLimit}
          onchange={handleLimitChange}
        ></lightning-input>
      </div>

      <!-- Generated SOQL -->
      <div class="qed-section">
        <p class="qed-label">Generated SOQL</p>
        <div class="qed-soql-preview">{generatedSoql}</div>
      </div>

      <!-- Parent Lookup Field — varies by relationship direction -->
      <template if:true={isUpRelationship}>
        <div class="qed-section">
          <p class="qed-label">Relationship</p>
          <p class="qed-hint qed-hint_up">
            ↑ Related record — fetched via <strong>{_query.parentLookupField}</strong> on the parent object.
            The renderer will query: <code>WHERE Id = :[parent.{_query.parentLookupField}]</code>
          </p>
        </div>
      </template>
      <template if:true={isDownRelationship}>
        <div class="qed-section">
          <lightning-combobox
            label="Parent Lookup Field"
            value={_query.parentLookupField}
            options={parentLookupFieldOptions}
            onchange={handleParentLookupChange}
            required
          ></lightning-combobox>
          <p class="qed-hint">The field on {_query.soqlObject} that relates back to the parent record (e.g. OpportunityId).</p>
        </div>
      </template>

    </template>
  </div>
</template>
