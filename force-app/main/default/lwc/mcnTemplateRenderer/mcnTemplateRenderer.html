<template>
    <div class="renderer-container">
        <!-- Loading -->
        <template if:true={isLoading}>
            <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
        </template>

        <!-- Error -->
        <template if:true={hasError}>
            <div class="error-banner" role="alert">
                <span class="error-icon">&#9888;</span>
                <span class="error-text">{errorMessage}</span>
                <button class="error-dismiss" onclick={clearError} aria-label="Dismiss error">&#x2715;</button>
            </div>
        </template>

        <!-- Empty state -->
        <template if:true={showEmptyState}>
            <div class="empty-state">
                <svg class="empty-icon" viewBox="0 0 48 48" aria-hidden="true">
                    <rect x="8" y="8" width="32" height="32" rx="4" fill="none" stroke="currentColor" stroke-width="2"/>
                    <line x1="14" y1="18" x2="34" y2="18" stroke="currentColor" stroke-width="2"/>
                    <line x1="14" y1="24" x2="28" y2="24" stroke="currentColor" stroke-width="2"/>
                    <line x1="14" y1="30" x2="24" y2="30" stroke="currentColor" stroke-width="2"/>
                </svg>
                <p class="empty-title">No Template Selected</p>
                <p class="empty-body">Provide a Template ID to preview the rendered email.</p>
            </div>
        </template>

        <!-- Rendered preview -->
        <template if:true={hasContent}>
            <div class="preview-header">
                <span class="preview-label">SUBJECT</span>
                <p class="preview-subject">{renderedSubject}</p>
            </div>
            <div class="preview-body">
                <!-- lwc:dom="manual" so we can set innerHTML safely -->
                <div class="html-preview" lwc:dom="manual"></div>
            </div>
        </template>
    </div>
</template>
