<template>
  <div class="canvas-designer">

    <!-- Mode toggle -->
    <div class="canvas-toolbar">
      <div class="mode-tabs">
        <button class={blocksModeClass} data-mode="blocks" onclick={handleModeChange}>
          &#x2709;&nbsp; Builder Blocks
        </button>
        <button class={htmlModeClass} data-mode="html" onclick={handleModeChange}>
          &#x1F4C4;&nbsp; HTML Mode
        </button>
      </div>
    </div>

    <!-- BUILDER BLOCKS MODE -->
    <template if:true={isBlocksMode}>
      <div class="email-mode-content">
        <template for:each={emailRegionGroups} for:item="group">
          <div key={group.region} class="region-group">
            <h4 class="region-group__label">{group.region}</h4>
            <template if:true={group.hasComponents}>
              <template for:each={group.components} for:item="comp">
                <c-weave-builder-component-card
                  key={comp.localKey}
                  component={comp}
                ></c-weave-builder-component-card>
              </template>
            </template>
            <template if:false={group.hasComponents}>
              <p class="region-group__empty">No components in {group.region}</p>
            </template>
          </div>
        </template>
        <template if:false={hasEmailComponents}>
          <div class="empty-state">
            <p class="empty-state__title">No email components yet</p>
            <p class="empty-state__sub">Use the controls above to add Header, Body, or Footer components.</p>
          </div>
        </template>
      </div>
    </template>

    <!-- HTML MODE -->
    <template if:true={isHtmlMode}>
      <div class="html-editor-section">

        <!-- Raw HTML textarea -->
        <div class="html-editor-block">
          <lightning-textarea
            label="Raw HTML Template"
            value={htmlContent}
            placeholder="Paste or type your HTML here. Use {{Parent.FieldName}} for merge tags."
            onchange={handleHtmlChange}
          ></lightning-textarea>
        </div>

        <!-- AI Prompt Builder -->
        <div class="ai-prompt-panel">
          <div class="ai-prompt-panel-header">
            <span class="ai-prompt-eyebrow">AI PROMPT BUILDER</span>
            <p class="ai-prompt-title">Generate HTML with AI</p>
            <p class="ai-prompt-sub">Describe what you want to build. The prompt below is pre-loaded with Weave merge tag syntax and your available fields — paste it into any AI tool.</p>
          </div>

          <div class="ai-prompt-describe">
            <lightning-textarea
              label="Describe your document"
              value={promptDescription}
              placeholder="Example: A professional invoice showing account name, opportunity amount, close date, and a branded header with our company logo area."
              onchange={handlePromptDescriptionChange}
            ></lightning-textarea>
          </div>

          <div class="ai-prompt-preview">
            <div class="ai-prompt-preview-header">
              <span class="ai-prompt-preview-label">READY-TO-COPY PROMPT</span>
              <button class={copyBtnClass} onclick={handleCopyPrompt}>
                <template if:false={promptCopied}>
                  &#x2398;&nbsp; Copy Prompt
                </template>
                <template if:true={promptCopied}>
                  &#x2713;&nbsp; Copied!
                </template>
              </button>
            </div>
            <pre class="ai-prompt-text">{weaveAiPrompt}</pre>
          </div>
        </div>

      </div>

      <!-- Footer: Preview PDF -->
      <div class="canvas-footer">
        <template if:true={isPreviewingPdf}>
          <lightning-spinner alternative-text="Generating PDF" size="small"></lightning-spinner>
        </template>
        <button class="btn-preview-pdf" onclick={handlePreviewPdf} disabled={isPreviewingPdf}>
          Preview PDF
        </button>
      </div>
    </template>

  </div>
</template>
