<template>
  <div class="canvas-designer">

    <!-- Mode toggle + PDF button -->
    <div class="canvas-toolbar">
      <div class="mode-tabs">
        <button class={richTextModeClass} data-mode="richtext" onclick={handleModeChange}>
          Rich Text
        </button>
        <button class={htmlModeClass} data-mode="html" onclick={handleModeChange}>
          &lt;/&gt;&nbsp;HTML
        </button>
      </div>
      <div class="toolbar-actions">
        <template if:true={isPreviewingPdf}>
          <lightning-spinner alternative-text="Generating PDF" size="small"></lightning-spinner>
        </template>
        <button class="btn-preview-pdf" onclick={handlePreviewPdf} disabled={isPreviewingPdf}>
          Preview PDF
        </button>
      </div>
    </div>

    <!-- RICH TEXT MODE -->
    <template if:true={isRichTextMode}>

      <!-- Insert toolbar -->
      <div class="insert-toolbar">
        <span class="insert-toolbar-label">INSERT</span>
        <button class={insertBtnClassImage} onclick={handleInsertImageToggle}>
          &#x1F5BC;&nbsp;Image
        </button>
        <button class={insertBtnClassQuery} onclick={handleInsertQueryToggle} disabled={hasNoQueries}>
          &#x1F4CB;&nbsp;Query Table
        </button>
        <button class={insertBtnClassMerge} onclick={handleInsertMergeToggle} disabled={hasNoParentFields}>
          &#x1F3F7;&nbsp;Merge Tag
        </button>
        <button class="insert-btn" onclick={handleInsertCta}>
          &#x1F517;&nbsp;CTA Button
        </button>
      </div>

      <!-- Insert: Image URL -->
      <template if:true={showInsertImage}>
        <div class="insert-panel">
          <div class="insert-panel-header">
            <span class="insert-panel-title">Insert Image</span>
            <button class="edit-panel-close" onclick={handleInsertImageClose}>&#x2715;</button>
          </div>
          <div class="form-row">
            <lightning-input
              label="Image URL"
              value={insertImageUrl}
              placeholder="https://example.com/image.png"
              onchange={handleInsertImageUrlChange}
            ></lightning-input>
          </div>
          <div class="insert-panel-actions">
            <button class="btn-cancel" onclick={handleInsertImageClose}>Cancel</button>
            <button class="btn-primary" onclick={handleInsertImageConfirm} disabled={noInsertImageUrl}>Insert</button>
          </div>
        </div>
      </template>

      <!-- Insert: Query Table picker -->
      <template if:true={showInsertQuery}>
        <div class="insert-panel">
          <div class="insert-panel-header">
            <span class="insert-panel-title">Insert Query Table</span>
            <button class="edit-panel-close" onclick={handleInsertQueryClose}>&#x2715;</button>
          </div>
          <div class="form-row">
            <lightning-combobox
              label="Select Query"
              value={selectedInsertQueryId}
              options={queryOptions}
              placeholder="Choose a query..."
              onchange={handleInsertQueryChange}
            ></lightning-combobox>
          </div>
          <div class="insert-panel-actions">
            <button class="btn-cancel" onclick={handleInsertQueryClose}>Cancel</button>
            <button class="btn-primary" onclick={handleInsertQueryConfirm} disabled={noInsertQuerySelected}>Insert</button>
          </div>
        </div>
      </template>

      <!-- Insert: Merge Tag picker -->
      <template if:true={showInsertMerge}>
        <div class="insert-panel">
          <div class="insert-panel-header">
            <span class="insert-panel-title">Insert Merge Tag</span>
            <button class="edit-panel-close" onclick={handleInsertMergeClose}>&#x2715;</button>
          </div>
          <div class="form-row">
            <lightning-combobox
              label="Select Field"
              value={selectedInsertMergeField}
              options={mergeTagOptions}
              placeholder="Choose a field..."
              onchange={handleInsertMergeChange}
            ></lightning-combobox>
          </div>
          <div class="insert-panel-actions">
            <button class="btn-cancel" onclick={handleInsertMergeClose}>Cancel</button>
            <button class="btn-primary" onclick={handleInsertMergeConfirm} disabled={noInsertMergeSelected}>Insert</button>
          </div>
        </div>
      </template>

      <!-- Rich text editor -->
      <lightning-input-rich-text
        value={htmlContent}
        variant="label-hidden"
        placeholder="Start building your template here…"
        onchange={handleRichTextChange}
      ></lightning-input-rich-text>

    </template>

    <!-- HTML MODE -->
    <template if:true={isHtmlMode}>
      <div class="html-editor-section">

        <div class="html-editor-block">
          <lightning-textarea
            label="HTML Template"
            value={htmlContent}
            placeholder="Paste or type your HTML here. Use {{Parent.FieldName}} for parent fields and {{Section.ApiName}} for query sections."
            onchange={handleHtmlChange}
          ></lightning-textarea>
        </div>

        <!-- AI Prompt Builder -->
        <div class="ai-prompt-panel">
          <div class="ai-prompt-panel-header">
            <span class="ai-prompt-eyebrow">AI PROMPT BUILDER</span>
            <p class="ai-prompt-title">Generate HTML with AI</p>
            <p class="ai-prompt-sub">Describe what you want to build. The prompt below is pre-loaded with Weave merge tag syntax and your available fields — paste it into any AI tool.</p>
          </div>

          <div class="ai-prompt-describe">
            <lightning-textarea
              label="Describe your document"
              value={promptDescription}
              placeholder="Example: A professional invoice showing account name, opportunity amount, close date, and a branded header with our company logo."
              onchange={handlePromptDescriptionChange}
            ></lightning-textarea>
          </div>

          <div class="ai-prompt-preview">
            <div class="ai-prompt-preview-header">
              <span class="ai-prompt-preview-label">READY-TO-COPY PROMPT</span>
              <button class={copyBtnClass} onclick={handleCopyPrompt}>
                <template if:false={promptCopied}>
                  &#x2398;&nbsp; Copy Prompt
                </template>
                <template if:true={promptCopied}>
                  &#x2713;&nbsp; Copied!
                </template>
              </button>
            </div>
            <pre class="ai-prompt-text">{weaveAiPrompt}</pre>
          </div>
        </div>

      </div>
    </template>

  </div>
</template>
