<template>
    <div class="library">

        <!-- Page header -->
        <div class="page-header">
            <div class="page-header-left">
                <p class="page-eyebrow">WEAVE</p>
                <h1 class="page-title">Recipient Segments</h1>
            </div>
            <div class="page-header-right">
                <button class="btn-primary" onclick={handleNew}>+ New Segment</button>
            </div>
        </div>

        <!-- Error banner -->
        <template if:true={errorMessage}>
            <div class="error-banner">
                <span>{errorMessage}</span>
                <button class="error-dismiss" onclick={handleDismissError}>&#x2715;</button>
            </div>
        </template>

        <!-- Edit / New modal -->
        <template if:true={showModal}>
            <section role="dialog" class="modal-backdrop">
                <div class="modal-container">
                    <header class="modal-header">
                        <h2 class="modal-title">{formTitle}</h2>
                        <button class="modal-close" onclick={handleCancel}>&#x2715;</button>
                    </header>
                    <div class="modal-body">
                        <template if:true={modalErrorMessage}>
                            <div class="error-banner">
                                <span>{modalErrorMessage}</span>
                                <button class="error-dismiss" onclick={handleDismissModalError}>&#x2715;</button>
                            </div>
                        </template>

                        <!-- Section 1: Details -->
                        <div class="form-section">
                            <p class="form-section-title">Details</p>

                            <div class="form-row">
                                <lightning-input label="Segment Name" value={editRecord.Name} data-field="Name"
                                    onchange={handleFieldChange} required>
                                </lightning-input>
                            </div>

                            <div class="form-row">
                                <lightning-combobox label="Status" value={editRecord.Status__c}
                                    options={statusOptions} data-field="Status__c" onchange={handleFieldChange} required>
                                </lightning-combobox>
                            </div>

                            <div class="form-row">
                                <lightning-textarea label="Description" value={editRecord.Description__c}
                                    data-field="Description__c" onchange={handleFieldChange}>
                                </lightning-textarea>
                            </div>

                            <div class="form-row">
                                <lightning-combobox
                                    label="Object"
                                    value={editRecord.Object_API_Name__c}
                                    options={objectOptions}
                                    data-field="Object_API_Name__c"
                                    onchange={handleObjectChange}
                                    placeholder="Select an object…"
                                    required>
                                </lightning-combobox>
                            </div>

                            <template if:true={editRecord.Object_API_Name__c}>
                                <div class="form-row">
                                    <lightning-combobox
                                        label="Email Field"
                                        value={editRecord.Email_Field_API_Name__c}
                                        options={emailFieldOptions}
                                        data-field="Email_Field_API_Name__c"
                                        onchange={handleFieldChange}
                                        placeholder="Select the email field…"
                                        required>
                                    </lightning-combobox>
                                </div>

                                <div class="form-row">
                                    <lightning-combobox
                                        label="Name Field"
                                        value={editRecord.Name_Field_API_Name__c}
                                        options={nameFieldOptions}
                                        data-field="Name_Field_API_Name__c"
                                        onchange={handleFieldChange}
                                        placeholder="Select the name/label field…"
                                        required>
                                    </lightning-combobox>
                                </div>
                            </template>
                        </div>

                        <!-- Section 2: Filter -->
                        <template if:true={editRecord.Object_API_Name__c}>
                            <div class="form-section">
                                <p class="form-section-title">Filter</p>

                                <template if:true={hasAvailableFields}>
                                    <div class="field-chips-wrap">
                                        <p class="field-chips-label">Insert field:</p>
                                        <div class="field-chips">
                                            <template for:each={availableFields} for:item="f">
                                                <button key={f.apiName} class="field-chip" data-field={f.apiName} onclick={handleInsertField}>{f.label}</button>
                                            </template>
                                        </div>
                                    </div>
                                </template>

                                <div class="form-row">
                                    <label class="soql-label">SOQL Filter (WHERE clause)</label>
                                    <textarea
                                        class="soql-textarea"
                                        onchange={handleSoqlChange}
                                        onblur={handleSoqlBlur}
                                        onmouseup={handleSoqlCursorSave}
                                        onkeyup={handleSoqlCursorSave}
                                        placeholder="e.g. MailingState = 'ON' AND HasOptedOutOfEmail = false"
                                        rows="4">
                                    </textarea>
                                    <p class="field-hint">Leave blank to include all records. Do not include the WHERE keyword.</p>
                                </div>
                            </div>

                            <!-- Section 3: Preview -->
                            <div class="form-section">
                                <div class="form-section-header">
                                    <p class="form-section-title">Preview</p>
                                    <button class="btn-sm-teal" onclick={handleRunPreview} disabled={isPreviewLoading}>
                                        {previewButtonLabel}
                                    </button>
                                </div>

                                <template if:true={isPreviewLoading}>
                                    <div class="preview-loading">
                                        <lightning-spinner alternative-text="Loading preview" size="small"></lightning-spinner>
                                    </div>
                                </template>

                                <template if:true={hasPreviewData}>
                                    <div class="preview-count-badge">{previewData.totalCount} record(s) match</div>
                                    <template if:true={hasPreviewRecords}>
                                        <table class="slds-table slds-table_cell-buffer slds-table_bordered preview-table">
                                            <thead>
                                                <tr class="slds-line-height_reset">
                                                    <th scope="col"><span class="slds-truncate">NAME</span></th>
                                                    <th scope="col"><span class="slds-truncate">EMAIL</span></th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                <template for:each={previewData.sampleRecords} for:item="row">
                                                    <tr key={row.email} class="slds-hint-parent">
                                                        <td>{row.name}</td>
                                                        <td>{row.email}</td>
                                                    </tr>
                                                </template>
                                            </tbody>
                                        </table>
                                        <template if:true={hasMoreThanSample}>
                                            <p class="field-hint">Showing first 10 of {previewData.totalCount} records.</p>
                                        </template>
                                    </template>
                                    <template if:false={hasPreviewRecords}>
                                        <p class="field-hint preview-hint">No matching records found.</p>
                                    </template>
                                </template>

                                <template if:false={hasPreviewData}>
                                    <template if:false={isPreviewLoading}>
                                        <p class="field-hint preview-hint">Click "Run Preview" to see matching records.</p>
                                    </template>
                                </template>
                            </div>
                        </template>

                    </div>
                    <footer class="modal-footer">
                        <button class="btn-cancel" onclick={handleCancel}>Cancel</button>
                        <button class="btn-primary" onclick={handleSave} disabled={isLoading}>
                            <template if:true={isLoading}>Saving…</template>
                            <template if:false={isLoading}>Save Segment</template>
                        </button>
                    </footer>
                </div>
            </section>
        </template>

        <!-- Filter row -->
        <div class="filter-row">
            <div class="filter-tabs">
                <button class={filterTabAll} data-status="All" onclick={handleStatusFilter}>All</button>
                <button class={filterTabActive} data-status="Active" onclick={handleStatusFilter}>Active</button>
                <button class={filterTabInactive} data-status="Inactive" onclick={handleStatusFilter}>Inactive</button>
            </div>
            <lightning-input
                type="search"
                placeholder="Search segments…"
                value={searchTerm}
                onchange={handleSearch}
                variant="label-hidden">
            </lightning-input>
        </div>

        <!-- Spinner -->
        <template if:true={isLoading}>
            <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
        </template>

        <!-- Segments table -->
        <template if:true={hasFilteredSegments}>
            <table class="slds-table slds-table_cell-buffer slds-table_bordered">
                <thead>
                    <tr class="slds-line-height_reset">
                        <th scope="col"><span class="slds-truncate">NAME</span></th>
                        <th scope="col"><span class="slds-truncate">OBJECT</span></th>
                        <th scope="col"><span class="slds-truncate">EMAIL FIELD</span></th>
                        <th scope="col"><span class="slds-truncate">STATUS</span></th>
                        <th scope="col"><span class="slds-truncate">ACTIONS</span></th>
                    </tr>
                </thead>
                <tbody>
                    <template for:each={filteredSegments} for:item="seg">
                        <tr key={seg.Id} class="slds-hint-parent">
                            <td>
                                <button class="row-name-link" data-segid={seg.Id} onclick={handleEdit}>{seg.Name}</button>
                            </td>
                            <td>{seg.Object_API_Name__c}</td>
                            <td>{seg.Email_Field_API_Name__c}</td>
                            <td><span class={seg.statusClass}>{seg.Status__c}</span></td>
                            <td>
                                <span class="action-links">
                                    <button class="action-link edit-link" data-segid={seg.Id} onclick={handleEdit}>Edit</button>
                                    <button class="action-link delete-link" data-segid={seg.Id} onclick={handleDeleteRow}>Delete</button>
                                </span>
                            </td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </template>

        <!-- Empty state -->
        <template if:false={hasFilteredSegments}>
            <template if:false={isLoading}>
                <div class="empty-state">
                    <svg class="empty-state-icon" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="24" cy="24" r="17" stroke="currentColor" stroke-width="2" fill="none" opacity="0.4"/>
                        <path d="M24 24 L24 10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        <path d="M24 24 L35 30" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        <path d="M24 24 L13 30" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
                    </svg>
                    <p class="empty-state-title">No segments found</p>
                    <p class="empty-state-body">Create your first recipient segment to define who receives your emails.</p>
                    <button class="btn-primary" onclick={handleNew}>+ New Segment</button>
                </div>
            </template>
        </template>

    </div>
</template>
