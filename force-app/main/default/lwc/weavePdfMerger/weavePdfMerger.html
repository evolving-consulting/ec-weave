<template>
    <lightning-card title="PDF Packet Generator" icon-name="utility:pdf">
        <div class="slds-p-around_medium">
            <template if:true={isLoading}>
                <lightning-spinner alternative-text="Generating PDF" size="small"></lightning-spinner>
            </template>
            <template if:true={errorMessage}>
                <div class="slds-notify slds-notify_alert slds-theme_error" role="alert">
                    <span>{errorMessage}</span>
                </div>
            </template>
            <template if:true={successDocumentId}>
                <div class="slds-notify slds-notify_toast slds-theme_success" role="status">
                    <span>PDF generated successfully. <a href={downloadUrl} target="_blank">Download</a></span>
                </div>
            </template>

            <p class="slds-m-bottom_small slds-text-color_weak">
                Add templates below to combine into a single PDF packet (cover + quote + terms, etc.).
            </p>

            <template for:each={items} for:item="item">
                <div class="item-row" key={item.key}>
                    <lightning-input
                        label="Template ID"
                        value={item.templateId}
                        data-key={item.key}
                        data-field="templateId"
                        onchange={handleItemChange}
                        placeholder="Weave_Template_Config__c ID">
                    </lightning-input>
                    <lightning-input
                        label="Record ID"
                        value={item.recordId}
                        data-key={item.key}
                        data-field="recordId"
                        onchange={handleItemChange}
                        placeholder="Source record ID">
                    </lightning-input>
                    <div class="item-remove">
                        <lightning-button-icon
                            icon-name="utility:close"
                            variant="bare"
                            data-key={item.key}
                            onclick={handleRemoveItem}
                            alternative-text="Remove">
                        </lightning-button-icon>
                    </div>
                </div>
            </template>

            <div class="slds-m-top_small">
                <lightning-button label="Add Template" icon-name="utility:add" onclick={handleAddItem}></lightning-button>
            </div>

            <div class="slds-m-top_medium">
                <lightning-input
                    label="PDF Title"
                    value={pdfTitle}
                    onchange={handleTitleChange}>
                </lightning-input>
            </div>

            <div class="slds-m-top_medium">
                <lightning-button
                    label="Generate PDF Packet"
                    variant="brand"
                    icon-name="utility:pdf"
                    disabled={isLoading}
                    onclick={handleGenerate}>
                </lightning-button>
            </div>
        </div>
    </lightning-card>
</template>
