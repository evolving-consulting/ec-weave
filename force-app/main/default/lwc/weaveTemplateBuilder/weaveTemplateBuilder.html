                  <button class="btn-scheduler-deactivate" onclick={handleDeactivateScheduler} disabled={isTogglingScheduler}>
                    <template if:true={isTogglingScheduler}>Deactivating…</template>
                    <template if:false={isTogglingScheduler}>Deactivate Scheduler</template>
                  </button>
                </template>
                <button class="btn-secondary scheduler-refresh-btn" onclick={loadSchedulerStatus}>Refresh Status</button>
              </div>
            </div>

            <!-- Info banner -->
            <div class="info-banner" style="margin-top: 1rem;">
              <lightning-icon icon-name="utility:info" size="x-small"></lightning-icon>
              <span>The scheduler runs <strong>WeaveScheduledEmailExecutor</strong>, which processes all <strong>Pending</strong> scheduled sends. Individual one-time sends scheduled from the template editor each have their own job and are unaffected by this setting.</span>
            </div>
          </template>
        </div>
      </template>

      <!-- ── RESOURCES VIEW ──────────────────────────────────────────────── -->
      <template if:true={isResourcesView}>
        <div class="library">
          <div class="page-header">
            <div class="page-header-left">
              <p class="page-eyebrow">WEAVE</p>
              <h1 class="page-title">Resources</h1>
            </div>
          </div>

          <p class="resources-intro">Everything you need to get the most out of Weave — stay up to date with the latest changes, learn through guided training, or connect with our support team.</p>

          <div class="resources-grid">

            <!-- Stay Current -->
            <div class="resource-card">
              <div class="resource-card__icon">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" width="28" height="28">
                  <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67V7z" fill="currentColor"/>
                </svg>
              </div>
              <p class="resource-card__eyebrow">STAY CURRENT</p>
              <h3 class="resource-card__title">What's New</h3>
              <p class="resource-card__body">Follow Weave's latest releases, feature additions, and improvements — all in one place.</p>
              <ul class="resource-card__list">
                <li>Release notes for every version</li>
                <li>New feature announcements</li>
                <li>Bug fixes and performance improvements</li>
              </ul>
              <div class="resource-card__actions">
                <a class="btn-resource" href="#" target="_blank" rel="noopener noreferrer">View Updates</a>
              </div>
            </div>

            <!-- Learn Weave -->
            <div class="resource-card resource-card_featured">
              <div class="resource-card__icon">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" width="28" height="28">
                  <path d="M12 3L1 9l11 6 9-4.91V17h2V9L12 3zM5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82z" fill="currentColor"/>
                </svg>
              </div>
              <p class="resource-card__eyebrow">LEARN WEAVE</p>
              <h3 class="resource-card__title">Training</h3>
              <p class="resource-card__body">Step-by-step guides and walkthroughs to help your team build, send, and manage Weave communications with confidence.</p>
              <ul class="resource-card__list">
                <li>Getting started with templates</li>
                <li>Connecting Salesforce data fields</li>
                <li>Segment setup and best practices</li>
                <li>Scheduler and automation guides</li>
              </ul>
              <div class="resource-card__actions">
                <a class="btn-resource btn-resource_primary" href="#" target="_blank" rel="noopener noreferrer">Open Training Hub</a>
              </div>
            </div>

            <!-- Get Help -->
            <div class="resource-card">
              <div class="resource-card__icon">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" width="28" height="28">
                  <path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z" fill="currentColor"/>
                </svg>
              </div>
              <p class="resource-card__eyebrow">GET HELP</p>
              <h3 class="resource-card__title">Contact Us</h3>
              <p class="resource-card__body">Connect with the Weave community or reach our team for dedicated, hands-on support.</p>
              <ul class="resource-card__list">
                <li>Ask questions and share tips with the community</li>
                <li>Template, configuration, and data questions</li>
                <li>Browse support plans for dedicated help</li>
              </ul>
              <div class="resource-card__actions">
                <a class="btn-resource" href="#" target="_blank" rel="noopener noreferrer">Join our Slack Community</a>
                <a class="btn-resource-link" href="#" target="_blank" rel="noopener noreferrer">View Support Plans</a>
              </div>
            </div>

          </div>
        </div>
      </template>

    </div><!-- /main-panel -->

    <!-- ── Component Edit Modal ────────────────────────────────────────── -->
    <template if:true={showComponentModal}>
      <section role="dialog" class="modal-backdrop">
        <div class="modal-container modal-container_wide">
          <header class="modal-header">
            <h2 class="modal-title">Edit Component — {editingComponent.componentType}</h2>
            <button class="modal-close" onclick={handleComponentModalClose}>✕</button>
          </header>

          <div class="modal-body modal-body_cols">

            <!-- Left column: name + editor -->
            <div class="comp-modal-left">
              <lightning-input
                label="Component Name"
                value={editingComponent.name}
                data-field="name"
                onchange={handleComponentFieldChange}
              ></lightning-input>

              <!-- Text / HTML Block: rich text or HTML editor -->
              <template if:true={editingComponentHasContent}>
                <div class="comp-edit-section">
                  <div class="comp-edit-toolbar">
                    <label class="comp-edit-label">Content</label>
                    <button class="comp-edit-mode-toggle" onclick={handleToggleEditorMode}>
                      {componentEditorToggleLabel}
                    </button>
                  </div>

                  <!-- Rich text mode -->
                  <template if:true={componentEditorIsRich}>
                    <lightning-input-rich-text
                      value={editingComponent.htmlOutput}
                      onchange={handleRichTextChange}
                      placeholder="Start typing or click a merge tag →"
                    ></lightning-input-rich-text>
                  </template>

                  <!-- HTML source mode -->
                  <template if:true={componentEditorIsHtml}>
                    <lightning-textarea
                      label=""
                      variant="label-hidden"
                      value={editingComponent.htmlOutput}
                      data-field="htmlOutput"
                      onchange={handleComponentFieldChange}
                      placeholder="Enter HTML. Click a merge tag to append it →"
                      max-length="131072"
                      class="comp-html-textarea"
                    ></lightning-textarea>
                  </template>
                </div>
              </template>

              <!-- Related Table: query picker + column config -->
              <template if:true={editingComponentIsRelatedTable}>
                <div class="comp-edit-section">
                  <lightning-combobox
                    label="Linked Query"
                    value={editingComponent._linkedQueryLocalKey}
                    options={queryOptionsForComponent}
                    onchange={handleComponentLinkedQueryChange}
                    placeholder="Select a query…"
                  ></lightning-combobox>
                  <p class="comp-edit-hint">The selected query drives this table's rows.</p>
                </div>

                <!-- Column editor -->
                <template if:true={editingComponentHasLinkedQuery}>
                  <div class="comp-edit-section">
                    <p class="comp-edit-label">Columns</p>
                    <template if:true={editingComponentColumns.length}>
                      <div class="col-editor">
                        <div class="col-editor__header">
                          <span class="col-editor__th col-editor__th--order">#</span>
                          <span class="col-editor__th col-editor__th--api">Field</span>
                          <span class="col-editor__th col-editor__th--label">Column Name</span>
                          <span class="col-editor__th col-editor__th--actions"></span>
                        </div>
                        <template for:each={editingComponentColumns} for:item="col">
                          <div key={col.apiName} class="col-editor__row">
                            <span class="col-editor__order">{col.order}</span>
                            <span class="col-editor__api">{col.apiName}</span>
                            <input
                              type="text"
                              class="col-editor__input"
                              value={col.label}
                              data-idx={col._idx}
                              onchange={handleColumnLabelChange}
                            />
                            <div class="col-editor__actions">
                              <button
                                class="col-btn col-btn--move"
                                data-idx={col._idx}
                                onclick={handleColumnMoveUp}
                                disabled={col._isFirst}
                                title="Move up"
                              >↑</button>
                              <button
                                class="col-btn col-btn--move"
                                data-idx={col._idx}
                                onclick={handleColumnMoveDown}
                                disabled={col._isLast}
                                title="Move down"
                              >↓</button>
                              <button
                                class="col-btn col-btn--remove"
                                data-idx={col._idx}
                                onclick={handleColumnRemove}
                                title="Remove column"
                              >×</button>
                            </div>
                          </div>
                        </template>
                      </div>
                    </template>
                    <template if:false={editingComponentColumns.length}>
                      <p class="comp-edit-hint">No fields found in the linked query's SOQL.</p>
                    </template>
                  </div>
                </template>
              </template>

              <!-- Button editor -->
              <template if:true={editingComponentIsButton}>
                <div class="comp-edit-section">
                  <lightning-input
                    label="Button Label"
                    value={editingComponentButtonConfig.label}
                    data-field="label"
                    onchange={handleButtonConfigChange}
                    placeholder="Click Here"
                  ></lightning-input>
                  <lightning-input
                    label="Button URL"
                    value={editingComponentButtonConfig.url}
                    data-field="url"
                    onchange={handleButtonConfigChange}
                    placeholder="https://… or {{Parent.FieldName}}"
                  ></lightning-input>
                  <lightning-input
                    label="Button Color (hex)"
                    value={editingComponentButtonConfig.color}
                    data-field="color"
                    onchange={handleButtonConfigChange}
                    placeholder="#1f5f5b"
                  ></lightning-input>
                </div>
              </template>

              <!-- Image editor -->
              <template if:true={editingComponentIsImage}>
                <div class="comp-edit-section">
                  <lightning-input
                    label="Image URL"
                    value={editingComponentButtonConfig.imageUrl}
                    data-field="imageUrl"
                    onchange={handleButtonConfigChange}
                    placeholder="Paste a public image URL or use Get Public URL from Files tab"
                  ></lightning-input>
                  <lightning-input
                    label="Alt Text"
                    value={editingComponentButtonConfig.altText}
                    data-field="altText"
                    onchange={handleButtonConfigChange}
                    placeholder="Image description"
                  ></lightning-input>
                  <lightning-input
                    label="Width (px or %)"
                    value={editingComponentButtonConfig.width}
                    data-field="width"
                    onchange={handleButtonConfigChange}
                    placeholder="e.g. 300 or 100%"
                  ></lightning-input>
                  <p class="comp-edit-hint">Upload images in the <strong>Files</strong> tab, then click "Get Public URL" and paste it here.</p>
                </div>
              </template>

              <!-- Visibility condition (all component types) -->
              <div class="comp-edit-section">
                <lightning-input
                  label="Show when (optional)"
                  value={editingComponent.visibilityCondition}
                  data-field="visibilityCondition"
                  onchange={handleComponentFieldChange}
                  placeholder="e.g. StageName == 'Closed Won' or Status__c != 'Inactive'"
                  maxlength="255"
                ></lightning-input>
                <p class="comp-edit-hint">Leave blank to always show. Supports field comparisons like <code>Status__c == &apos;Active&apos;</code>, numeric comparisons like <code>Amount &gt; 1000</code>, or just a field name to show when it has a value.</p>
              </div>

            </div>

            <!-- Right column: merge tag browser (only for content types) -->
            <template if:true={editingComponentHasContent}>
              <div class="comp-modal-right">
                <div class="merge-panel">
                  <div class="merge-panel__header">
                    <span class="merge-panel__title">Merge Tags</span>
                    <span class="merge-panel__hint">Click to insert</span>
                  </div>
                  <input
                    type="search"
                    class="merge-panel__search"
                    placeholder="Search fields…"
                    value={mergeTagSearch}
                    oninput={handleMergeTagSearch}
                  />
                  <template if:true={isLoadingMergeTags}>
                    <p class="merge-panel__loading">Loading fields…</p>
                  </template>
                  <div class="merge-panel__groups">
                    <template for:each={mergeTagGroups} for:item="group">
                      <div key={group.key} class="merge-group">
                        <p class="merge-group__label">{group.label}</p>
                        <template if:true={group.hasFields}>
                          <div class="merge-group__chips">
                            <template for:each={group.fields} for:item="f">
                              <button
                                key={f.apiName}
                                class="merge-chip"
                                data-tag={f.tag}
                                onclick={handleInsertMergeTag}
                                title={f.tag}
                              >
                                {f.apiName}
                                <span
                                  class="merge-chip__copy"
                                  data-tag={f.tag}
                                  onclick={handleCopyMergeTag}
                                  title="Copy to clipboard"
                                >⎘</span>
                              </button>
                            </template>
                          </div>
                        </template>
                        <template if:false={group.hasFields}>
                          <p class="merge-group__empty">No matching fields</p>
                        </template>
                      </div>
                    </template>
                  </div>
                </div>
              </div>
            </template>

          </div><!-- /modal-body_cols -->

          <footer class="modal-footer">
            <button class="btn-cancel" onclick={handleComponentModalClose}>Cancel</button>
            <button class="btn-activate-template" onclick={handleComponentModalSave}>Save Component</button>
          </footer>
        </div>
      </section>
    </template>

    <!-- ── Recipient Modal ───────────────────────────────────────────────── -->
    <template if:true={showRecipientModal}>
      <section role="dialog" class="modal-backdrop">
        <div class="modal-container modal-container_recipient">
          <header class="modal-header">
            <h2 class="modal-title">Recipient</h2>
            <button class="modal-close" onclick={handleRecipientModalClose}>✕</button>
          </header>
          <div class="modal-body">
            <div class="form-row-2">
              <lightning-combobox
                label="Recipient Type"
                value={editingRecipient.recipientType}
                options={recipientTypeOptions}
                data-field="recipientType"
                onchange={handleRecipientFieldChange}
              ></lightning-combobox>
              <lightning-combobox
                label="Source"
                value={editingRecipient.recipientSourceType}
                options={recipientSourceOptions}
                data-field="recipientSourceType"
                onchange={handleRecipientFieldChange}
              ></lightning-combobox>
            </div>

            <!-- Parent Field -->
            <template if:true={editingRecipientIsParentField}>
              <div class="form-row-2">
                <lightning-combobox
                  label="Email Field"
                  value={editingRecipient.emailFieldApiName}
                  options={parentFieldOptions}
                  data-field="emailFieldApiName"
                  onchange={handleRecipientFieldChange}
                  placeholder="Select field…"
                ></lightning-combobox>
                <lightning-combobox
                  label="Name Field"
                  value={editingRecipient.nameFieldApiName}
                  options={parentFieldOptions}
                  data-field="nameFieldApiName"
                  onchange={handleRecipientFieldChange}
                  placeholder="Select field…"
                ></lightning-combobox>
              </div>
            </template>

            <!-- Related Records: pick from template queries -->
            <template if:true={editingRecipientIsRelatedRecords}>
              <lightning-combobox
                label="Linked Query"
                value={editingRecipient._linkedQueryLocalKey}
                options={templateQueryOptions}
                placeholder="Select a query…"
                onchange={handleRecipientQuerySelect}
              ></lightning-combobox>
              <p class="modal-hint">The query determines which records to fetch. Email + Name fields come from that object's records.</p>
              <template if:true={recipientHasLinkedQueryFields}>
                <div class="form-row-2">
                  <lightning-combobox
                    label="Email Field"
                    value={editingRecipient.emailFieldApiName}
                    options={recipientLinkedQueryFieldOptions}
                    data-field="emailFieldApiName"
                    onchange={handleRecipientFieldChange}
                    placeholder="Select email field…"
                  ></lightning-combobox>
                  <lightning-combobox
                    label="Name Field"
                    value={editingRecipient.nameFieldApiName}
                    options={recipientLinkedQueryFieldOptions}
                    data-field="nameFieldApiName"
                    onchange={handleRecipientFieldChange}
                    placeholder="Select name field…"
                  ></lightning-combobox>
                </div>
              </template>
              <template if:false={recipientHasLinkedQueryFields}>
                <div class="form-row-2">
                  <lightning-input
                    label="Email Field API Name"
                    value={editingRecipient.emailFieldApiName}
                    data-field="emailFieldApiName"
                    onchange={handleRecipientFieldChange}
                    placeholder="e.g. Email"
                  ></lightning-input>
                  <lightning-input
                    label="Name Field API Name"
                    value={editingRecipient.nameFieldApiName}
                    data-field="nameFieldApiName"
                    onchange={handleRecipientFieldChange}
                    placeholder="e.g. Name"
                  ></lightning-input>
                </div>
              </template>
            </template>

            <!-- Manual: static email address -->
            <template if:true={editingRecipientIsManual}>
              <lightning-input
                label="Email Address"
                type="email"
                value={editingRecipient.emailFieldApiName}
                data-field="emailFieldApiName"
                onchange={handleRecipientFieldChange}
                placeholder="user@example.com"
              ></lightning-input>
            </template>

            <!-- Dynamic Segment: pick a saved segment -->
            <template if:true={editingRecipientIsDynamicSegment}>
              <lightning-combobox
                label="Recipient Segment"
                value={editingRecipient.segmentId}
                options={segmentComboboxOptions}
                onchange={handleRecipientSegmentChange}
                placeholder="Select a segment…"
                required
              ></lightning-combobox>
              <template if:true={editingRecipient.segmentName}>
                <p class="modal-hint">Recipients will be resolved from segment <strong>{editingRecipient.segmentName}</strong> at send time.</p>
              </template>
              <template if:false={hasAvailableSegments}>
                <p class="modal-hint">No active segments found. Create segments in the Segments section of the builder.</p>
              </template>
            </template>

            <template if:true={editingRecipientIsParentField}>
              <lightning-input
                label="Filter Logic"
                value={editingRecipient.filterLogic}
                data-field="filterLogic"
                onchange={handleRecipientFieldChange}
                placeholder="Optional WHERE clause for related queries"
              ></lightning-input>
            </template>

            <div class="form-row-checks">
              <lightning-input type="checkbox" label="Default Selected"
                checked={editingRecipient.defaultSelected}
                data-field="defaultSelected"
                onchange={handleRecipientCheckboxChange}
              ></lightning-input>
              <lightning-input type="checkbox" label="Required"
                checked={editingRecipient.required}
                data-field="required"
                onchange={handleRecipientCheckboxChange}
              ></lightning-input>
              <lightning-input type="checkbox" label="Allow Multiple"
                checked={editingRecipient.allowMultiple}
                data-field="allowMultiple"
                onchange={handleRecipientCheckboxChange}
              ></lightning-input>
            </div>
          </div>
          <footer class="modal-footer">
            <button class="btn-cancel" onclick={handleRecipientModalClose}>Cancel</button>
            <button class="btn-activate-template" onclick={handleRecipientModalSave}>Save Recipient</button>
          </footer>
        </div>
      </section>
    </template>

    <!-- ── Action Modal ───────────────────────────────────────────────────── -->
    <template if:true={showActionModal}>
      <section role="dialog" class="modal-backdrop">
        <div class={actionModalContainerClass}>
          <header class="modal-header">
            <h2 class="modal-title">Post-Send Action — {editingAction.actionType}</h2>
            <button class="modal-close" onclick={handleActionModalClose}>✕</button>
          </header>
          <div class={actionModalBodyClass}>

            <!-- Left column: form fields -->
            <div class={actionModalLeftClass}>

              <!-- Update Field -->
              <template if:true={editingActionIsUpdateField}>
                <lightning-combobox
                  label="Field to Update"
                  value={editingAction.fieldApiName}
                  options={updateableFieldOptions}
                  data-field="fieldApiName"
                  onchange={handleActionFieldChange}
                  placeholder="Select field…"
                ></lightning-combobox>
                <lightning-combobox
                  label="Value Type"
                  value={editingAction.valueType}
                  options={valueTypeOptions}
                  data-field="valueType"
                  onchange={handleActionFieldChange}
                ></lightning-combobox>
                <lightning-input
                  label="Value"
                  value={editingAction.value}
                  data-field="value"
                  onchange={handleActionFieldChange}
                  onfocus={handleActionMergeTagFocus}
                  placeholder="Static text or {{Parent.FieldName}}"
                ></lightning-input>
              </template>

              <!-- Create Task -->
              <template if:true={editingActionIsCreateTask}>
                <lightning-input
                  label="Task Subject"
                  value={editingAction.taskSubject}
                  data-field="taskSubject"
                  onchange={handleActionFieldChange}
                  onfocus={handleActionMergeTagFocus}
                  required
                ></lightning-input>
                <lightning-combobox
                  label="Assigned To"
                  value={editingAction.assignedToType}
                  options={assignedToOptions}
                  data-field="assignedToType"
                  onchange={handleActionFieldChange}
                ></lightning-combobox>
                <template if:true={editingActionAssignedSpecific}>
                  <lightning-input
                    label="User ID"
                    value={editingAction.assignedUserId}
                    data-field="assignedUserId"
                    onchange={handleActionFieldChange}
                    placeholder="Salesforce User Id"
                  ></lightning-input>
                </template>
                <div class="form-row-2">
                  <lightning-combobox
                    label="Due Date"
                    value={editingAction.dueDateStrategy}
                    options={dueDateOptions}
                    data-field="dueDateStrategy"
                    onchange={handleActionFieldChange}
                  ></lightning-combobox>
                  <template if:true={editingActionDueDateIsDays}>
                    <lightning-input
                      type="number"
                      label="Days After Send"
                      value={editingAction.daysAfterSend}
                      min="1"
                      data-field="daysAfterSend"
                      onchange={handleActionNumberChange}
                    ></lightning-input>
                  </template>
                </div>
                <div class="form-row-2">
                  <lightning-combobox
                    label="Status"
                    value={editingAction.taskStatus}
                    options={taskStatusOptions}
                    data-field="taskStatus"
                    onchange={handleActionFieldChange}
                  ></lightning-combobox>
                  <lightning-combobox
                    label="Priority"
                    value={editingAction.taskPriority}
                    options={taskPriorityOptions}
                    data-field="taskPriority"
                    onchange={handleActionFieldChange}
                  ></lightning-combobox>
                </div>
                <lightning-textarea
                  label="Description"
                  value={editingAction.taskDescription}
                  data-field="taskDescription"
                  onchange={handleActionFieldChange}
                  onfocus={handleActionMergeTagFocus}
                ></lightning-textarea>
              </template>

              <div class="form-row-checks" style="margin-top:12px">
                <lightning-input type="checkbox" label="Active"
                  checked={editingAction.active}
                  data-field="active"
                  onchange={handleActionCheckboxChange}
                ></lightning-input>
              </div>
            </div><!-- /left column -->

            <!-- Right column: merge tag picker -->
            <template if:true={editingActionShowsMergeTags}>
              <div class="comp-modal-right">
                <div class="merge-panel">
                  <div class="merge-panel__header">
                    <span class="merge-panel__title">Merge Tags</span>
                    <span class="merge-panel__hint">Click to insert · ⎘ to copy</span>
                  </div>
                  <input
                    type="search"
                    class="merge-panel__search"
                    placeholder="Search fields…"
                    value={mergeTagSearch}
                    oninput={handleMergeTagSearch}
                  />
                  <template if:true={isLoadingMergeTags}>
                    <p class="merge-panel__loading">Loading fields…</p>
                  </template>
                  <div class="merge-panel__groups">
                    <template for:each={mergeTagGroups} for:item="group">
                      <div key={group.key} class="merge-group">
                        <p class="merge-group__label">{group.label}</p>
                        <template if:true={group.hasFields}>
                          <div class="merge-group__chips">
                            <template for:each={group.fields} for:item="f">
                              <button
                                key={f.apiName}
                                class="merge-chip"
                                data-tag={f.tag}
                                onclick={handleInsertActionMergeTag}
                                title={f.tag}
                              >
                                {f.apiName}
                                <span
                                  class="merge-chip__copy"
                                  data-tag={f.tag}
                                  onclick={handleCopyActionMergeTag}
                                  title="Copy to clipboard"
                                >⎘</span>
                              </button>
                            </template>
                          </div>
                        </template>
                        <template if:false={group.hasFields}>
                          <p class="merge-group__empty">No matching fields</p>
                        </template>
                      </div>
                    </template>
                  </div>
                </div>
              </div>
            </template>

          </div><!-- /modal-body -->
          <footer class="modal-footer">
            <button class="btn-cancel" onclick={handleActionModalClose}>Cancel</button>
            <button class="btn-activate-template" onclick={handleActionModalSave}>Save Action</button>
          </footer>
        </div>
      </section>
    </template>

    <!-- ── Query Modal ──────────────────────────────────────────────────── -->
    <template if:true={showQueryModal}>
      <section role="dialog" class="modal-backdrop">
        <div class="modal-container">
          <header class="modal-header">
            <h2 class="modal-title">Query Editor</h2>
            <button class="modal-close" onclick={handleQueryModalClose}>✕</button>
          </header>
          <div class="modal-body">
            <lightning-input
              label="Query Name"
              value={editingQuery.name}
              onchange={handleQueryNameChange}
              required
            ></lightning-input>
            <c-weave-builder-query-editor
              query={editingQuery}
              related-object-options={relatedObjectOptions}
              related-object-meta={relatedObjectMeta}
              parent-object-api-name={draftTemplate.parentObjectApiName}
              parent-query-options={parentQueryOptions}
              onquerychange={handleQueryEditorChange}
            ></c-weave-builder-query-editor>
          </div>
          <footer class="modal-footer">
            <button class="btn-cancel" onclick={handleQueryModalClose}>Cancel</button>
            <button class="btn-activate-template" onclick={handleQueryModalSave}>Save Query</button>
          </footer>
        </div>
      </section>
    </template>

    <!-- Clone template modal -->
    <template if:true={showCloneModal}>
      <section class="slds-modal slds-fade-in-open" aria-modal="true">
        <div class="slds-modal__container modal-container">
          <header class="slds-modal__header modal-header">
            <h2 class="modal-title">Clone Template</h2>
            <button class="modal-close" onclick={handleCloneModalClose}>✕</button>
          </header>
          <div class="slds-modal__content modal-body">
            <p style="font-size:13px;color:var(--ec-brand-muted);margin-bottom:16px">Copies all queries, HTML, recipients, actions, attachments and settings. Enter a unique name and API Name for the clone.</p>
            <div class="form-row">
              <lightning-input
                label="Template Name"
                value={cloneName}
                data-field="cloneName"
                onchange={handleCloneFieldChange}
                required
              ></lightning-input>
            </div>
            <div class="form-row">
              <lightning-input
                label="API Name"
                value={cloneApiName}
                data-field="cloneApiName"
                onchange={handleCloneFieldChange}
                required
                placeholder="e.g. My_Template_Copy"
              ></lightning-input>
            </div>
            <div class="form-row">
              <lightning-combobox
                label="Template Output Type"
                value={cloneOutputType}
                options={outputTypeOptions}
                data-field="cloneOutputType"
                onchange={handleCloneFieldChange}
              ></lightning-combobox>
            </div>
          </div>
          <footer class="modal-footer">
            <button class="btn-cancel" onclick={handleCloneModalClose}>Cancel</button>
            <button class="btn-activate-template" onclick={handleCloneConfirm} disabled={isCloning}>
              <template if:true={isCloning}>Cloning…</template>
              <template if:false={isCloning}>Clone Template</template>
            </button>
          </footer>
        </div>
      </section>
      <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
  </div>
</template>
